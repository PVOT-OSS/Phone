name: Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pvotlib-ref:
        description: PvotLib branch, tag or commit to build against
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PvotLib
        uses: actions/checkout@v4
        with:
          repository: PVOT-OSS/PvotLib
          ref: ${{ inputs.pvotlib-ref || 'main' }}
          path: PvotLib

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Phone reads PvotLib from Maven local, at the version in its catalog.
      - name: Publish PvotLib to the local Maven repository
        working-directory: PvotLib
        run: |
          version=$(sed -n 's/^pvot = "\(.*\)"$/\1/p' ../gradle/libs.versions.toml)
          chmod +x gradlew
          ./gradlew :design-system:publishToMavenLocal :core-ui:publishToMavenLocal -Pversion="$version"

      - name: Unit tests
        run: ./gradlew :app:testUserDebugUnitTest :app:testSystemDebugUnitTest

      # Baselines live in app/src/test/screenshots; re-record with ./gradlew :app:recordRoborazziUserDebug.
      - name: Screenshots match
        run: ./gradlew :app:verifyRoborazziUserDebug

      - name: User build has no privileged permissions
        run: ./gradlew :app:checkUserDebugPermissions :app:checkUserReleasePermissions

      - name: Lint
        run: ./gradlew :app:lintUserDebug

      - name: Build
        run: ./gradlew :app:assembleUserDebug :app:assembleSystemDebug :app:assembleUserRelease :app:assembleSystemRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: phone-apks
          path: app/build/outputs/apk/*/*/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
