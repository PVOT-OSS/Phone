protobuf = "4.36.2"
protobufPlugin = "0.10.0"
pvot = "0.2.0-SNAPSHOT"
robolectric = "4.17"
roborazzi = "1.77.0"

[libraries]
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-annotation = "androidx.annotation:annotation:1.11.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-cardview = "androidx.cardview:cardview:1.0.0"
androidx-core-splashscreen = "androidx.core:core-splashscreen:1.0.1"
androidx-car-app = "androidx.car.app:app:1.7.0"
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-collection = "androidx.collection:collection:1.7.0"
androidx-coordinatorlayout = "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
androidx-dynamicanimation = "androidx.dynamicanimation:dynamicanimation:1.1.0"
androidx-exifinterface = "androidx.exifinterface:exifinterface:1.4.2"
androidx-fragment = "androidx.fragment:fragment:1.9.1"
androidx-localbroadcastmanager = "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
